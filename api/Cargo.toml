[package]
name = "crabfit-api"
description = "API for Crab Fit"
license = "GPL-3.0-only"
version = "3.0.0"
edition = "2021"

[features]
sql-adaptor = []

[workspace]
members = ["common", "adaptors/*"]

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.162", features = ["derive"] }
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
common = { path = "common" }
sql-adaptor = { path = "adaptors/sql" }
memory-adaptor = { path = "adaptors/memory" }
dotenvy = "0.15.7"
serde_json = "1.0.96"
rand = "0.8.5"
punycode = "0.4.1"
regex = "1.8.1"
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
chrono = "0.4.24"
bcrypt = "0.14.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower_governor = "0.8.0"
tower = "0.5.3"
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
base64 = "0.21.0"
time = "0.3.36"
axum-auth = "0.8.1"
