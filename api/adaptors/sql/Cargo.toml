[package]
name = "sql-adaptor"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.68"
common = { path = "../../common" }
sea-orm = { version = "2.0.4", features = [ "macros", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-native-tls" ] }
serde = { version = "1.0.162", features = [ "derive" ] }
sea-orm-migration = "2.0.4"
serde_json = "1.0.96"
chrono = "0.4.24"
thiserror = "2.0.21"
